<svg xmlns="http://www.w3.org/2000/svg" width="672" height="672" viewBox="0 0 672 672">
  <!--
    火薬玉の本体（鋳鉄球＋口金）。生成png(images/hud_weapons/bomb.png)の写し。
    座標系: viewBox 672x672。球は正円で中心(336,372)・半径300(下端672にぴったり)。
    width/height 属性は必須 ― 無いと Chrome が Image 経由の描画で寸法を 300x150 と
    解釈し、drawImage で歪む。
    導火線と火花は含めない ― 揺れと明滅があるのでゲーム側(weapon.js)が描く。
    描き順は【縄 → この絵 → 火】。口金が縄の根元を隠す。

    ▼ png からの実測値(2026-08-11。玉の直径D=330 / 半径R=165 が基準)
      ※ XMLコメント内に連続ハイフンは書けない(SVGが壊れて画像が読めなくなる)
      口金の幅       0.41R  → 122px(x=275〜397)
      口金の見える高さ 0.115R → 35px。png は口金が【玉より手前】にあるので
                     全高が見える。玉の後ろに置くと玉の輪郭より上しか出ず、
                     0.06R しか見えなくて「薄い」と差し戻された(2026-08-11)。
      口金の位置     【玉の上に載せる】。玉へめり込ませない(差し戻し 2026-08-11)。
                     下端は玉の球面と接する y=79 に置く
                     (半幅61での球面 = 372 - √(300²-61²) = 78.3。
                      これより上げると角の下に隙間が空いて浮いて見える)。
                     → y = 79 - 35 = 44、上端は玉の上端(72)から 0.093R 上
      口金の色       明部 rgb(122,120,120) / 影 rgb(60,56,59)
      玉の明度       左上ハイライト(171,162,158) / 中央(55,52,54) /
                     右下(24,23,28) / 下端(7,6,6) / 左端(40,38,38)
    絵を差し替えたらここを測り直すこと。
  -->
  <defs>
    <radialGradient id="ballBase" cx="42%" cy="38%" r="76%" fx="32%" fy="26%">
      <stop offset="0" stop-color="#8f8983"/>
      <stop offset=".08" stop-color="#5a5450"/>
      <stop offset=".2" stop-color="#3b3735"/>
      <stop offset=".42" stop-color="#2a2729"/>
      <stop offset=".68" stop-color="#181618"/>
      <stop offset=".88" stop-color="#0d0c0d"/>
      <stop offset="1" stop-color="#060506"/>
    </radialGradient>
    <!-- 左上の拡散光。png のハイライトは白飛びせず、鋳肌の粒が透ける -->
    <radialGradient id="ballGlow" cx="31%" cy="25%" r="34%">
      <stop offset="0" stop-color="#b4aca6" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#8d8781" stop-opacity=".16"/>
      <stop offset="1" stop-color="#6e6a66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballVignette" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".62" stop-color="#000000" stop-opacity="0"/>
      <stop offset=".86" stop-color="#000000" stop-opacity=".38"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".72"/>
    </radialGradient>
    <!-- 鋳肌: 細かい明るい粒。縮小表示でも残るよう粒は大きめ -->
    <filter id="grainLight" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.085" numOctaves="3" seed="11" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.72  0 0 0 0 0.71  0 0 0 0 0.68  0 0 0 0.6 -0.2"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <!-- 鋳肌: 大きい暗いムラ(鋳物の巣) -->
    <filter id="grainDark" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.038" numOctaves="3" seed="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0.8 -0.26"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <!-- 口金の縦の明度は png 実測のとおり:
           上端に明るい縁(約155/255)→ すぐ落ちて 約80 → 下へ向かって緩く 約62。
         【途中に暗い帯は無い】。以前は輪の陰影のつもりで中ほどへ暗い帯を
         敷いていたが、png に無く「この水平線は何」と差し戻された(2026-08-11)。
         帯ではなく連続したグラデーションで面を作ること。 -->
    <linearGradient id="collarV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b8987"/>
      <stop offset=".07" stop-color="#9a9896"/>
      <stop offset=".2" stop-color="#565453"/>
      <stop offset=".58" stop-color="#4e4c4d"/>
      <stop offset="1" stop-color="#3b393a"/>
    </linearGradient>
    <!-- 横方向は円筒の回り込み(左右が暗い)。こちらも帯にしない -->
    <linearGradient id="collarH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141313" stop-opacity=".72"/>
      <stop offset=".3" stop-color="#8e8b89" stop-opacity=".14"/>
      <stop offset=".7" stop-color="#242223" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0d0c0c" stop-opacity=".78"/>
    </linearGradient>
    <clipPath id="ballClip"><circle cx="336" cy="372" r="300"/></clipPath>
    <!-- 口金の輪郭。上辺はごく浅いアーチ(中央で約3px持ち上げ)。
         真っ平だと板を貼ったように見える。真横視点は崩さないので
         楕円の口(俯瞰)は描かない ― あくまで縁のふくらみだけ。 -->
    <path id="collarShape"
          d="M275 79 L275 54 Q275 48 281 47.4 Q336 41 391 47.4 Q397 48 397 54 L397 79 Z"/>
    <clipPath id="collarClip"><use href="#collarShape"/></clipPath>
    <!-- 口金が玉に落とす影(据わりを出す) -->
    <radialGradient id="collarSeat" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#000000" stop-opacity=".26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== 鋳鉄球（正円） ===== -->
  <circle cx="336" cy="372" r="300" fill="url(#ballBase)"/>
  <g clip-path="url(#ballClip)">
    <circle cx="336" cy="372" r="300" fill="url(#ballGlow)"/>
    <circle cx="336" cy="372" r="300" filter="url(#grainLight)" opacity=".26"/>
    <circle cx="336" cy="372" r="300" filter="url(#grainDark)" opacity=".3"/>
    <!-- 鋳物の傷を数点。ノイズだけだと均質すぎる -->
    <ellipse cx="242" cy="292" rx="7" ry="3.2" transform="rotate(-24 242 292)" fill="#0c0c0c" opacity=".5"/>
    <ellipse cx="412" cy="252" rx="5" ry="2.4" transform="rotate(14 412 252)" fill="#0d0d0d" opacity=".45"/>
    <ellipse cx="304" cy="512" rx="9" ry="3.6" transform="rotate(8 304 512)" fill="#080808" opacity=".55"/>
    <ellipse cx="214" cy="240" rx="4" ry="4" fill="#9a9c92" opacity=".16"/>
    <circle cx="336" cy="372" r="300" fill="url(#ballVignette)"/>
  </g>
  <!-- 縁は輪郭線ではなく、暗く落ちる面で締める(線を引くと平面に見える) -->
  <circle cx="336" cy="372" r="298.5" fill="none" stroke="#050506" stroke-opacity=".5" stroke-width="3"/>

  <!-- ===== 口金（玉の【上に載る】。真横視点の短い輪。左右中央） =====
       png は口金が玉の手前にあり、全高(0.115R)が見える。玉の後ろへ置くと
       輪郭より上しか出ず「薄い」絵になる。かといって玉へめり込ませると
       埋まって見えるので、下端を球面(y=78.3)に接する y=79 に置いて【載せる】。
       導火線の根元はこの輪と玉が隠す(縄は本体SVGより先に描かれる)。 -->
  <ellipse cx="336" cy="80" rx="74" ry="13" fill="url(#collarSeat)"/>
  <g>
    <use href="#collarShape" fill="url(#collarV)"/>
    <g clip-path="url(#collarClip)">
      <rect x="275" y="41" width="122" height="38" fill="url(#collarH)"/>
      <!-- 上端の明るい縁。上辺のアーチに沿わせる(横一文字の帯にしない) -->
      <path d="M279 47.6 Q336 41.3 393 47.6" fill="none"
            stroke="#a5a19f" stroke-opacity=".85" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <use href="#collarShape" fill="none" stroke="#0a0a09" stroke-opacity=".85" stroke-width="4"/>
  </g>
</svg>
