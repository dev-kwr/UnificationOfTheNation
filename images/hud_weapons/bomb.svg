<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="body" cx="34%" cy="32%" r="70%" fx="27%" fy="24%">
      <stop offset="0" stop-color="#666c75"/>
      <stop offset=".18" stop-color="#454a52"/>
      <stop offset=".50" stop-color="#262a2f"/>
      <stop offset="1" stop-color="#080a0d"/>
    </radialGradient>
    <radialGradient id="diffuse" cx="28%" cy="24%" r="63%">
      <stop offset="0" stop-color="#ecf1f8" stop-opacity=".17"/>
      <stop offset=".30" stop-color="#cfd6e0" stop-opacity=".085"/>
      <stop offset=".68" stop-color="#a1aab7" stop-opacity=".03"/>
      <stop offset="1" stop-color="#828c9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="specular" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fafbfd" stop-opacity=".28"/>
      <stop offset=".42" stop-color="#e6ebf2" stop-opacity=".13"/>
      <stop offset="1" stop-color="#d2dae5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="socket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#858b94"/>
      <stop offset=".28" stop-color="#555b64"/>
      <stop offset=".72" stop-color="#292d34"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2b15"/>
      <stop offset=".38" stop-color="#986334"/>
      <stop offset=".62" stop-color="#c18a4e"/>
      <stop offset="1" stop-color="#40230f"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b92e10"/>
      <stop offset=".42" stop-color="#ff6417"/>
      <stop offset=".76" stop-color="#ffb522"/>
      <stop offset="1" stop-color="#ffe58a"/>
    </linearGradient>
    <clipPath id="ballClip">
      <circle cx="256" cy="292" r="172"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#00040a" flood-opacity=".58"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- 鋳鉄球。実ゲームCanvasと同じ左上光源・色停止位置。 -->
    <circle cx="256" cy="292" r="172" fill="url(#body)"/>
    <circle cx="256" cy="292" r="172" fill="url(#diffuse)"/>
    <g clip-path="url(#ballClip)">
      <ellipse cx="198" cy="219" rx="57" ry="21" transform="rotate(-33 198 219)" fill="url(#specular)"/>
    </g>
    <circle cx="256" cy="292" r="170" fill="none" stroke="#06080b" stroke-opacity=".74" stroke-width="5"/>

    <!-- 真横から見た短い導火線。反復する縄目を外し、一本の繊維として描く。 -->
    <path d="M256 132C267 118 274 84 279 55" fill="none" stroke="#241207" stroke-width="19" stroke-linecap="round"/>
    <path d="M256 132C267 118 274 84 279 55" fill="none" stroke="url(#rope)" stroke-width="13" stroke-linecap="round"/>
    <path d="M259 128C268 114 274 83 278 59" fill="none" stroke="#e1ae67" stroke-opacity=".30" stroke-width="3" stroke-linecap="round"/>

    <!-- Canvasと共通の三層口金。横から見える押さえ・胴・下端だけを描く。 -->
    <rect x="215" y="148" width="82" height="15" rx="5" fill="#171b20" stroke="#0f1216" stroke-width="4"/>
    <rect x="220" y="126" width="72" height="34" rx="8" fill="url(#socket)" stroke="#171a1f" stroke-width="5"/>
    <rect x="228" y="123" width="56" height="10" rx="4" fill="#686e76" stroke="#1b1f24" stroke-width="4"/>
    <path d="M229 136H283" fill="none" stroke="#d8dee7" stroke-opacity=".32" stroke-width="4" stroke-linecap="round"/>
    <path d="M222 158H290" fill="none" stroke="#07090c" stroke-opacity=".62" stroke-width="3" stroke-linecap="round"/>

    <!-- 導火線と一体化した涙形の炎。独立した丸は使わない。 -->
    <path d="M279 58C262 47 266 29 281 17C299 35 298 50 279 58Z" fill="url(#ember)"/>
    <path d="M279 54C272 46 274 36 281 28C289 40 288 49 279 54Z" fill="#fff4b8" opacity=".88"/>
    <circle cx="297" cy="31" r="3" fill="#ff8131" opacity=".55"/>
  </g>
</svg>
